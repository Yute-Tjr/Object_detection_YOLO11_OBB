name: terminal-inspection

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terminal_inspection}
      POSTGRES_USER: ${POSTGRES_USER:-terminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terminal}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python scripts/run_terminal_api.py --host 0.0.0.0 --port 8000"]
    environment: &terminal-environment
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terminal}:${POSTGRES_PASSWORD:-terminal}@postgres:5432/${POSTGRES_DB:-terminal_inspection}
      INSPECTION_STORAGE_ROOT: /data/terminal-inspection
      DETECTOR_WEIGHTS: /weights/detector/yolo11l_obb_best.pt
      LABEL3_CLASSIFIER_WEIGHTS: /weights/classifiers/label3/resnet18_best.pt
      LABEL5_CLASSIFIER_WEIGHTS: /weights/classifiers/label5/resnet18_best.pt
      DETECTION_DEVICE: ${DETECTION_DEVICE:-cpu}
      CLASSIFICATION_DEVICE: ${CLASSIFICATION_DEVICE:-cpu}
      DETECTION_IMGSZ: "1280"
      CLASSIFICATION_IMGSZ: "224"
      MAX_IMAGES_PER_TASK: ${MAX_IMAGES_PER_TASK:-100}
    volumes:
      - ./weights:/weights:ro
      - inspection-data:/data/terminal-inspection
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    command: ["python", "scripts/run_terminal_worker.py"]
    environment: *terminal-environment
    volumes:
      - ./weights:/weights:ro
      - inspection-data:/data/terminal-inspection
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  inspection-data:
